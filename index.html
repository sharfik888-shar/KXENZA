<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KXENZA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --red: #e11d2e;
      --red-hover: #ff2b3d;
      --red-glow: rgba(225, 29, 46, 0.4);
      --text: #ffffff;
      --muted: #8a8a8a;
      --error: #ff4d5e;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(225, 29, 46, 0.15), transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(225, 29, 46, 0.1), transparent 50%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .tabs {
      display: flex;
      background: #0f0f0f;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab.active {
      background: var(--red);
      color: white;
      box-shadow: 0 0 20px var(--red-glow);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field label .optional {
      color: #555;
      font-weight: 400;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      background: #0f0f0f;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    .field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.15);
    }

    .field input::placeholder {
      color: #444;
    }

    .field input.invalid {
      border-color: var(--error);
    }

    .hint {
      font-size: 12px;
      margin-top: 6px;
      color: var(--muted);
      min-height: 16px;
    }

    .hint.error { color: var(--error); }
    .hint.success { color: #3ddc84; }

    .btn-primary {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--red) 0%, #b0101f 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px var(--red-glow);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--red-hover) 0%, var(--red) 100%);
      box-shadow: 0 0 30px var(--red-glow);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .message.show { display: block; }
    .message.error {
      background: rgba(255, 77, 94, 0.1);
      border: 1px solid rgba(255, 77, 94, 0.3);
      color: var(--error);
    }
    .message.success {
      background: rgba(61, 220, 132, 0.1);
      border: 1px solid rgba(61, 220, 132, 0.3);
      color: #3ddc84;
    }

    .form { display: none; }
    .form.active { display: block; animation: fadeIn 0.3s ease; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 24px;
      line-height: 1.6;
    }

    .footer-note a {
      color: var(--red);
      text-decoration: none;
    }

    .welcome {
      text-align: center;
      display: none;
    }

    .welcome.show { display: block; animation: fadeIn 0.5s ease; }

    .welcome .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--red), #6b0b13);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      border: 3px solid var(--red);
      box-shadow: 0 0 30px var(--red-glow);
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .btn-logout {
      padding: 12px 24px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="kxGrad" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#e11d2e"/>
            <stop offset="100%" stop-color="#6b0b13"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#kxGrad)"/>
        <path d="M16 14 L24 24 L16 34" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M32 14 L24 24 L32 34" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
      </svg>
      <span class="logo-text">KXENZA</span>
    </div>
    <p class="subtitle">Мессенджер нового поколения</p>

    <div id="authScreen">
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">Вход</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
      </div>

      <div id="messageBox" class="message"></div>

      <form class="form active" id="loginForm">
        <div class="field">
          <label>Юзернейм</label>
          <input type="text" id="loginUsername" placeholder="ваш_юзернейм" autocomplete="username" />
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
      </form>

      <form class="form" id="registerForm">
        <div class="field">
          <label>Юзернейм</label>
          <input type="text" id="regUsername" placeholder="минимум 6 символов" autocomplete="username" />
          <div class="hint" id="usernameHint">Только буквы, цифры и _ , от 6 до 20 символов</div>
        </div>

        <div class="field">
          <label>Пароль</label>
          <input type="password" id="regPassword" placeholder="минимум 6 символов" autocomplete="new-password" />
          <div class="hint" id="passwordHint">Минимум 6 символов</div>
        </div>

        <div class="field">
          <label>Email <span class="optional">(необязательно)</span></label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label>Номер телефона <span class="optional">(необязательно)</span></label>
          <input type="tel" id="regPhone" placeholder="+7 700 000 00 00" autocomplete="tel" />
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">Создать аккаунт</button>
      </form>
    </div>

    <div class="welcome" id="welcomeScreen">
      <div class="avatar" id="welcomeAvatar">K</div>
      <h2>Добро пожаловать, <span id="welcomeName"></span>!</h2>
      <p>Вы успешно вошли в KXENZA</p>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>

    <p class="footer-note">
      Используя KXENZA, вы соглашаетесь с <a href="#">условиями</a>
    </p>
  </div>

  <script>
    // ========================
    // 🔑 ВАШИ КЛЮЧИ SUPABASE
    // ========================
    const SUPABASE_URL = 'https://ptqhkiguikwwoyekmzaf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WWu9cljXNNFq-Cf3CAAbOw_OMYwZYeq';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========================
    // 🎨 УТИЛИТЫ UI
    // ========================
    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
      hideMessage();
    }

    function showMessage(text, type = 'error') {
      const box = document.getElementById('messageBox');
      box.textContent = text;
      box.className = 'message show ' + type;
    }

    function hideMessage() {
      const box = document.getElementById('messageBox');
      box.className = 'message';
    }

    function setLoading(btn, loading, text) {
      if (loading) {
        btn.dataset.originalText = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>' + (text || 'Загрузка...');
        btn.disabled = true;
      } else {
        btn.textContent = btn.dataset.originalText || text;
        btn.disabled = false;
      }
    }

    // ========================
    // ✅ ВАЛИДАЦИЯ
    // ========================
    const USERNAME_REGEX = /^[a-zA-Z0-9_]{6,20}$/;

    function validateUsername(username) {
      if (!username) return 'Введите юзернейм';
      if (username.length < 6) return 'Минимум 6 символов';
      if (username.length > 20) return 'Максимум 20 символов';
      if (!USERNAME_REGEX.test(username)) return 'Только буквы, цифры и _';
      return null;
    }

    function validatePassword(password) {
      if (!password) return 'Введите пароль';
      if (password.length < 6) return 'Минимум 6 символов';
      return null;
    }

    const regUsernameInput = document.getElementById('regUsername');
    const usernameHint = document.getElementById('usernameHint');

    regUsernameInput.addEventListener('input', () => {
      const val = regUsernameInput.value.trim();
      const err = val ? validateUsername(val) : null;
      if (val && err) {
        usernameHint.textContent = err;
        usernameHint.className = 'hint error';
        regUsernameInput.classList.add('invalid');
      } else {
        usernameHint.textContent = 'Только буквы, цифры и _ , от 6 до 20 символов';
        usernameHint.className = 'hint';
        regUsernameInput.classList.remove('invalid');
      }
    });

    // ========================
    // 📝 РЕГИСТРАЦИЯ (С АВТОВХОДОМ)
    // ========================
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const username = regUsernameInput.value.trim();
      const password = document.getElementById('regPassword').value;
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const btn = document.getElementById('registerBtn');

      const usernameErr = validateUsername(username);
      if (usernameErr) return showMessage(usernameErr);

      const passwordErr = validatePassword(password);
      if (passwordErr) return showMessage(passwordErr);

      setLoading(btn, true, 'Проверка...');

      // Проверяем, занят ли юзернейм
      const { data: existing } = await db
        .from('profiles')
        .select('username')
        .eq('username', username)
        .maybeSingle();

      if (existing) {
        setLoading(btn, false);
        return showMessage('Этот юзернейм уже занят');
      }

      setLoading(btn, true, 'Создание...');

      // Supabase Auth требует email — если нет, генерируем внутренний
      const authEmail = email || `${username}@kxenza.local`;

      const { data: authData, error: authError } = await db.auth.signUp({
        email: authEmail,
        password: password,
      });

      if (authError) {
        setLoading(btn, false);
        if (authError.message.includes('already')) {
          return showMessage('Этот email уже используется');
        }
        return showMessage(authError.message);
      }

      // Создаём профиль
      if (authData.user) {
        const { error: profileError } = await db.from('profiles').insert({
          id: authData.user.id,
          username: username,
          email: email || null,
          phone: phone || null,
        });

        if (profileError) {
          setLoading(btn, false);
          return showMessage('Ошибка профиля: ' + profileError.message);
        }
      }

      setLoading(btn, false);

      // 🎉 СРАЗУ ВХОДИМ БЕЗ ПЕРЕКЛЮЧЕНИЯ НА ВКЛАДКУ ВХОДА
      showMessage('Аккаунт создан! Входим...', 'success');
      setTimeout(() => showWelcome(username), 800);
    });

    // ========================
    // 🔐 ВХОД
    // ========================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        return showMessage('Заполните все поля');
      }

      setLoading(btn, true, 'Вход...');

      const { data: profile } = await db
        .from('profiles')
        .select('email')
        .eq('username', username)
        .maybeSingle();

      if (!profile) {
        setLoading(btn, false);
        return showMessage('Пользователь не найден');
      }

      const loginEmail = profile.email || `${username}@kxenza.local`;

      const { error } = await db.auth.signInWithPassword({
        email: loginEmail,
        password: password,
      });

      setLoading(btn, false);

      if (error) {
        return showMessage('Неверный пароль');
      }

      showWelcome(username);
    });

    // ========================
    // 🎉 ЭКРАН ПОСЛЕ ВХОДА
    // ========================
    function showWelcome(username) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('welcomeScreen').classList.add('show');
      document.getElementById('welcomeName').textContent = username;
      document.getElementById('welcomeAvatar').textContent = username[0].toUpperCase();
    }

    async function logout() {
      await db.auth.signOut();
      document.getElementById('welcomeScreen').classList.remove('show');
      document.getElementById('authScreen').style.display = 'block';
      document.getElementById('loginForm').reset();
      document.getElementById('registerForm').reset();
      hideMessage();
    }

    // ========================
    // 🔄 ПРОВЕРКА СЕССИИ ПРИ ЗАГРУЗКЕ
    // ========================
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const { data: profile } = await db
          .from('profiles')
          .select('username')
          .eq('id', session.user.id)
          .maybeSingle();
        if (profile) showWelcome(profile.username);
      }
    })();
  </script>
</body>
</html>
