<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KXENZA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    :root {
      --bg: #0a0a0a; --card: #141414; --border: #2a2a2a;
      --red: #e11d2e; --red-hover: #ff2b3d; --red-glow: rgba(225, 29, 46, 0.4);
      --text: #ffffff; --muted: #8a8a8a; --error: #ff4d5e; --msg-out: #b0101f; --msg-in: #1f1f1f;
    }
    body {
      height: 100vh; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    
    /* --- ЭКРАН АВТОРИЗАЦИИ --- */
    #authScreen {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: fadeIn 0.5s ease; margin: 20px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
    .logo-text { font-size: 32px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, #fff 0%, var(--red) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tabs { display: flex; background: #0f0f0f; border-radius: 12px; padding: 4px; margin: 24px 0; border: 1px solid var(--border); }
    .tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--muted); font-size: 14px; font-weight: 600; border-radius: 9px; cursor: pointer; }
    .tab.active { background: var(--red); color: white; box-shadow: 0 0 20px var(--red-glow); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; padding: 14px 16px; background: #0f0f0f; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; }
    .field input:focus { border-color: var(--red); }
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--red) 0%, #b0101f 100%); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 0 20px var(--red-glow); }
    .message { padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }
    .message.show { display: block; }
    .message.error { background: rgba(255, 77, 94, 0.1); border: 1px solid rgba(255, 77, 94, 0.3); color: var(--error); }
    .message.success { background: rgba(61, 220, 132, 0.1); border: 1px solid rgba(61, 220, 132, 0.3); color: #3ddc84; }
    .form { display: none; } .form.active { display: block; }

    /* --- ЭКРАН МЕССЕНДЖЕРА --- */
    #chatScreen {
      display: none; width: 100%; height: 100%; background: var(--bg); overflow: hidden;
    }
    #chatScreen.show { display: flex; }
    
    .sidebar {
      width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--card);
      transition: transform 0.3s ease;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    .search-box { padding: 16px; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 10px 14px; background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }
    .search-box input:focus { border-color: var(--red); }
    
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 12px; }
    .chat-item:hover { background: #1a1a1a; }
    .chat-item.active { background: #2a0b0f; border-left: 3px solid var(--red); }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .chat-last-msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Окно чата */
    .main-chat {
      flex: 1; display: flex; flex-direction: column; background: #0a0a0a;
      background-image: radial-gradient(circle at 50% 50%, rgba(225, 29, 46, 0.03), transparent 60%);
    }
    .chat-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--card); }
    .chat-header .chat-name { font-size: 18px; }
    
    .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg-bubble {
      max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4;
      word-break: break-word; position: relative;
    }
    .msg-out { align-self: flex-end; background: var(--msg-out); color: white; border-bottom-right-radius: 4px; }
    .msg-in { align-self: flex-start; background: var(--msg-in); color: white; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; display: block; }
    
    .message-input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--card); }
    .message-input-area input { flex: 1; padding: 14px; background: #0a0a0a; border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; }
    .message-input-area input:focus { border-color: var(--red); }
    .btn-send { padding: 0 20px; background: var(--red); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-send:hover { background: var(--red-hover); box-shadow: 0 0 15px var(--red-glow); }

    .empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }

    /* Мобильная версия */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
      .sidebar.hidden { transform: translateX(-100%); }
      .main-chat { width: 100%; position: absolute; z-index: 5; }
      .back-btn { display: block !important; }
    }
    .back-btn { display: none; background: transparent; border: none; color: white; font-size: 20px; margin-right: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <div id="authScreen">
    <div class="logo"><span class="logo-text">KXENZA</span></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Вход</button>
      <button class="tab" onclick="switchTab('register')">Регистрация</button>
    </div>
    <div id="authMessage" class="message"></div>

    <form class="form active" id="loginForm">
      <div class="field"><label>Юзернейм</label><input type="text" id="loginUsername" placeholder="KXENZA" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••••" /></div>
      <button type="submit" class="btn" id="loginBtn">Войти</button>
    </form>

    <form class="form" id="registerForm">
      <div class="field"><label>Юзернейм</label><input type="text" id="regUsername" placeholder="минимум 6 символов" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="regPassword" placeholder="минимум 6 символов" /></div>
      <div class="field"><label>Email (необязательно)</label><input type="email" id="regEmail" /></div>
      <button type="submit" class="btn" id="registerBtn">Создать аккаунт</button>
    </form>
  </div>

  <!-- ЭКРАН ЧАТОВ -->
  <div id="chatScreen">
    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>KXENZA <span id="myUsernameDisplay" style="font-size: 14px; color: var(--muted);"></span></h2>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchUser" placeholder="Поиск по юзернейму..." oninput="searchUsers(this.value)" />
        <div id="searchResults" style="position: absolute; background: var(--card); width: calc(100% - 32px); border: 1px solid var(--border); border-radius: 8px; margin-top: 5px; display: none; z-index: 20;"></div>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Окно чата -->
    <div class="main-chat" id="mainChat">
      <div class="empty-chat" id="emptyState">Выберите чат или найдите пользователя</div>
      
      <div id="activeChatArea" style="display: none; flex-direction: column; height: 100%;">
        <div class="chat-header">
          <button class="back-btn" onclick="toggleMobileSidebar()">←</button>
          <div class="chat-avatar" id="headerAvatar">U</div>
          <div class="chat-name" id="headerName">Пользователь</div>
        </div>
        
        <div class="messages-area" id="messagesArea"></div>
        
        <div class="message-input-area">
          <input type="text" id="messageInput" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()" />
          <button class="btn-send" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ptqhkiguikwwoyekmzaf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WWu9cljXNNFq-Cf3CAAbOw_OMYwZYeq';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let activeChatId = null;
    let messageSubscription = null;

    // --- УТИЛИТЫ АВТОРИЗАЦИИ ---
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      if(tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
      hideAuthMessage();
    }
    function showAuthMessage(text, type = 'error') {
      const box = document.getElementById('authMessage');
      box.textContent = text; box.className = 'message show ' + type;
    }
    function hideAuthMessage() { document.getElementById('authMessage').className = 'message'; }

    // --- ВХОД И РЕГИСТРАЦИЯ ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { data: profile } = await db.from('profiles').select('email').eq('username', username).maybeSingle();
      if (!profile) return showAuthMessage('Пользователь не найден');
      
      const email = profile.email || `${username}@kxenza.local`;
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showAuthMessage('Неверный пароль');
      initMessenger();
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const emailInput = document.getElementById('regEmail').value.trim();
      const email = emailInput || `${username}@kxenza.local`;

      const { data: existing } = await db.from('profiles').select('id').eq('username', username).maybeSingle();
      if (existing) return showAuthMessage('Юзернейм занят');

      const { data: authData, error } = await db.auth.signUp({ email, password });
      if (error) return showAuthMessage(error.message);
      
      if (authData.user) {
        await db.from('profiles').insert({ id: authData.user.id, username, email: emailInput || null });
        initMessenger();
      }
    });

    // --- ЛОГИКА МЕССЕНДЖЕРА ---
    async function initMessenger() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return;
      
      const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
      currentUser = profile;
      
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('chatScreen').classList.add('show');
      document.getElementById('myUsernameDisplay').textContent = '@' + currentUser.username;
      
      loadChats();
      setupRealtime();
    }

    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    // --- ПОИСК ПОЛЬЗОВАТЕЛЕЙ ---
    async function searchUsers(query) {
      const resBox = document.getElementById('searchResults');
      if (query.length < 2) { resBox.style.display = 'none'; return; }
      
      const { data: users } = await db.from('profiles').select('id, username').ilike('username', `%${query}%`).neq('id', currentUser.id).limit(5);
      
      if (users && users.length > 0) {
        resBox.innerHTML = users.map(u => `
          <div style="padding: 12px; cursor: pointer; border-bottom: 1px solid var(--border);" onclick="startChat('${u.id}', '${u.username}')">
            <b>${u.username}</b>
          </div>
        `).join('');
        resBox.style.display = 'block';
      } else {
        resBox.style.display = 'none';
      }
    }

    // --- СОЗДАНИЕ ИЛИ ОТКРЫТИЕ ЧАТА ---
    async function startChat(targetUserId, targetUsername) {
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchUser').value = '';

      // Ищем, есть ли уже чат с этим пользователем
      const { data: myChats } = await db.from('chat_members').select('chat_id').eq('user_id', currentUser.id);
      let existingChatId = null;
      
      if (myChats) {
        for (let mc of myChats) {
          const { data: otherMember } = await db.from('chat_members').select('user_id').eq('chat_id', mc.chat_id).eq('user_id', targetUserId).maybeSingle();
          if (otherMember) { existingChatId = mc.chat_id; break; }
        }
      }

      if (existingChatId) {
        openChat(existingChatId, targetUsername);
      } else {
        // Создаем новый чат
        const { data: newChat } = await db.from('chats').insert({ is_group: false }).select().single();
        await db.from('chat_members').insert([
          { chat_id: newChat.id, user_id: currentUser.id },
          { chat_id: newChat.id, user_id: targetUserId }
        ]);
        openChat(newChat.id, targetUsername);
        loadChats();
      }
    }

    // --- СПИСОК ЧАТОВ ---
    async function loadChats() {
      const { data: memberships } = await db.from('chat_members').select('chat_id').eq('user_id', currentUser.id);
      const listBox = document.getElementById('chatList');
      listBox.innerHTML = '';
      
      if (!memberships || memberships.length === 0) {
        listBox.innerHTML = '<div style="padding: 20px; color: var(--muted); text-align: center;">Нет чатов. Найдите друга!</div>';
        return;
      }

      for (let m of memberships) {
        const { data: otherMembers } = await db.from('chat_members').select('user_id').eq('chat_id', m.chat_id).neq('user_id', currentUser.id);
        
        let chatName = 'Чат';
        if (otherMembers && otherMembers.length > 0) {
          const { data: otherProfile } = await db.from('profiles').select('username').eq('id', otherMembers[0].user_id).single();
          if (otherProfile) chatName = otherProfile.username;
        }

        const { data: lastMsg } = await db.from('messages').select('content').eq('chat_id', m.chat_id).order('created_at', { ascending: false }).limit(1).maybeSingle();

        listBox.innerHTML += `
          <div class="chat-item" id="chat-${m.chat_id}" onclick="openChat('${m.chat_id}', '${chatName}')">
            <div class="chat-avatar">${chatName[0].toUpperCase()}</div>
            <div class="chat-info">
              <div class="chat-name">${chatName}</div>
              <div class="chat-last-msg">${lastMsg ? lastMsg.content : 'Нет сообщений'}</div>
            </div>
          </div>
        `;
      }
    }

    // --- ОТКРЫТИЕ ЧАТА ---
    async function openChat(chatId, chatName) {
      activeChatId = chatId;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('activeChatArea').style.display = 'flex';
      document.getElementById('headerName').textContent = chatName;
      document.getElementById('headerAvatar').textContent = chatName[0].toUpperCase();
      
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('chat-' + chatId);
      if (activeEl) activeEl.classList.add('active');

      // На мобилках скрываем сайдбар
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');

      loadMessages(chatId);
    }

    // --- ЗАГРУЗКА СООБЩЕНИЙ ---
    async function loadMessages(chatId) {
      const { data: msgs } = await db.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';
      
      if (msgs) {
        msgs.forEach(msg => {
          const isOut = msg.sender_id === currentUser.id;
          const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          area.innerHTML += `
            <div class="msg-bubble ${isOut ? 'msg-out' : 'msg-in'}">
              ${msg.content}
              <span class="msg-time">${time}</span>
            </div>
          `;
        });
        area.scrollTop = area.scrollHeight;
      }
    }

    // --- ОТПРАВКА ---
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeChatId) return;

      input.value = '';
      await db.from('messages').insert({
        chat_id: activeChatId,
        sender_id: currentUser.id,
        content: text
      });
    }

    // --- REALTIME (МГНОВЕННЫЕ СООБЩЕНИЯ) ---
    function setupRealtime() {
      db.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const newMsg = payload.new;
          if (newMsg.chat_id === activeChatId) {
            const isOut = newMsg.sender_id === currentUser.id;
            const time = new Date(newMsg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const area = document.getElementById('messagesArea');
            area.innerHTML += `
              <div class="msg-bubble ${isOut ? 'msg-out' : 'msg-in'}">
                ${newMsg.content}
                <span class="msg-time">${time}</span>
              </div>
            `;
            area.scrollTop = area.scrollHeight;
          }
          loadChats(); // Обновляем последнее сообщение в списке
        })
        .subscribe();
    }

    // --- МОБИЛЬНАЯ ВЕРСТКА ---
    function toggleMobileSidebar() {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('activeChatArea').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      activeChatId = null;
    }

    // --- ПРОВЕРКА СЕССИИ ПРИ ЗАГРУЗКЕ ---
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) initMessenger();
    })();
  </script>
</body>
</html>
